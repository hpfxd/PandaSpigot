name: Build

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin
          cache: gradle

      - name: Set Git identity
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git config --global init.defaultBranch master

      - name: Setup build environment
        run: ./panda setup

      - name: Apply patches
        run: ./panda patch

      - name: Build
        run: ./gradlew build paperclipJar

      - name: Copy Paperclip jar
        run: |
          cp -v "./paperclip/build/libs/paperclip-1.8.8-R0.1-SNAPSHOT.jar" "./pandaspigot-$GITHUB_RUN_NUMBER.jar"

      - name: Copy API jar
        run: |
          cp -v "./PandaSpigot-API/build/libs/pandaspigot-api-1.8.8-R0.1-SNAPSHOT.jar" "./pandaspigot-api-$GITHUB_RUN_NUMBER.jar"

      - name: Upload Server artifact
        uses: actions/upload-artifact@v6
        with:
          name: Server JAR
          path: pandaspigot-${{ github.run_number }}.jar
          if-no-files-found: error

      - name: Upload API artifact
        uses: actions/upload-artifact@v6
        with:
          name: API JAR
          path: pandaspigot-api-${{ github.run_number }}.jar
          if-no-files-found: error
